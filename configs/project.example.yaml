project:
  name: f1-recognition
  raw_images_dir: D:/Arc/F1
  notes: >
    This file stores default training knobs only. Dataset locations are still
    provided on the command line so the project is easy to move between machines.

classifier:
  backbone: resnet50
  heads: [team, car_model]
  epochs: 24
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  image_size: 384
  dropout: 0.2
  num_workers: 4
  early_stop_score: 1.0
  early_stop_patience: 3

  # Training efficiency
  val_every: 1
  quick_val_ratio: null
  val_cache_mode: null
  grad_accum_steps: 1
  freeze_backbone: false
  freeze_backbone_epochs: 0
  balanced_head: null
  auto_batch: false
  auto_batch_min: 1
